[package]
name = "save-relay"
version = "1.0.0-rc.2"
edition = "2021"
license = "MIT"
description = "Share game saves between machines through Nextcloud (WebDAV), Google Drive or Dropbox"
repository = "https://github.com/iannitram/save-relay"
publish = false

[lib]
name = "save_relay"
path = "src/lib.rs"
# `staticlib` and `cdylib` are for the C interface (feature `ffi`, `src/ffi.rs`): a game port's
# Android or iOS app links one of them. Without the feature they hold only the Rust library.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "save-relay"
path = "src/main.rs"

[features]
# The platform parts. Their crates are added by their issues (docs/code-map.md):
# `http` gets ureq with rustls (the real `http::Transport`, used by all three backends),
# `keyring` gets the keyring crate. The backends themselves (WebDAV, Dropbox, Google Drive)
# are plain Rust over `http::Transport` and always built, so CI tests them against the fakes
# with no network, and a mobile build can supply its own Transport and CredentialStore.
default = ["http", "keyring"]
http = ["dep:ureq"]
keyring = ["dep:keyring"]
# Embed the built panel front end (`panel/dist`, from `pnpm --dir panel build`) into
# `save-relay panel`; off by default, so a plain `cargo build` needs no Node and serves a
# placeholder page. Release builds turn it on.
panel-dist = []
# The C interface for Android and iOS apps (`src/ffi.rs`, `include/save_relay.h`). The app brings
# its own network and credential store through callbacks, so a mobile build needs neither `http`
# nor `keyring`: `--no-default-features --features ffi`.
ffi = []
# No system libraries, so the core builds for Linux, Windows, macOS, Android and iOS
# (`ring`, under rustls, compiles its own bundled C: docs/code-map.md, rules).
[dependencies]
getrandom = "0.2"
# Crash-safe file writes shared with my other repos (craft-libs, MIT OR Apache-2.0), pinned to a commit.
craft-atomic = { git = "https://github.com/iannitram/craft-libs", rev = "72ae8f3640bc605f489a5eb46bcc0f4aa9dc649c" }
quick-xml = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The ludusavi data reader (`ludusavi::parse`): pure Rust, MIT OR Apache-2.0 (docs/adr/0003).
serde-saphyr = "2.0"
sha2 = "0.10"
# Case folding and Unicode normalization for installer manifest path collisions (#309).
caseless = "0.2"
unicode-normalization = "0.1"
# keyring 4: `v1` (default) picks Keychain on macOS, Credential Manager on Windows and the
# pure-Rust zbus Secret Service on Linux (no libdbus; keyring 3's sync backend needs it).
keyring = { version = "4.2", optional = true }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }

# Handle-relative, no-follow file operations for the game-file engine (src/gamefiles/fsx.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
