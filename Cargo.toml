[package]
name = "save-relay"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Share game saves between machines through Nextcloud (WebDAV), Google Drive or Dropbox"
repository = "https://github.com/iannitram/save-relay"
publish = false

[lib]
name = "save_relay"
path = "src/lib.rs"

[[bin]]
name = "save-relay"
path = "src/main.rs"

[features]
# The platform parts. Their crates are added by their issues (docs/code-map.md):
# `http` gets ureq with rustls (the real `http::Transport`, used by all three backends),
# `keyring` gets the keyring crate. The backends themselves (WebDAV, Dropbox, Google Drive)
# are plain Rust over `http::Transport` and always built, so CI tests them against the fakes
# with no network, and a mobile build can supply its own Transport and CredentialStore.
default = ["http", "keyring"]
http = ["dep:ureq"]
keyring = ["dep:keyring"]
# Embed the built panel front end (`panel/dist`, from `pnpm --dir panel build`) into
# `save-relay panel`; off by default, so a plain `cargo build` needs no Node and serves a
# placeholder page. Release builds turn it on.
panel-dist = []
# The ludusavi data reader (`ludusavi::parse`) gets serde-saphyr (MIT OR Apache-2.0, pure
# Rust) from its issue (docs/adr/0003-baton-wrap-cards-panel.md).

# No system libraries, so the core builds for Linux, Windows, macOS and later Android and iOS
# (`ring`, under rustls, compiles its own bundled C: docs/code-map.md, rules).
[dependencies]
getrandom = "0.2"
quick-xml = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# keyring 4: `v1` (default) picks Keychain on macOS, Credential Manager on Windows and the
# pure-Rust zbus Secret Service on Linux (no libdbus; keyring 3's sync backend needs it).
keyring = { version = "4.2", optional = true }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
