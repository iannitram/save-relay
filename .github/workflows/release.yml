name: release

# Release binaries (#24, M8, M15). A `v*` tag builds the binaries, writes SHA256SUMS and attaches
# them, with the Decky plugin zip and the panel zip, to a GitHub release. A workflow_dispatch run
# does the same builds and uploads the files as run artifacts only: the dry run, and it makes no
# release. A pull request that changes this file gets the same dry run, so its head is built.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # The version, and the panel's front end: every binary embeds the same `panel/dist` with the
    # `panel-dist` feature (Cargo.toml), so it is built once here and passed on as an artifact.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A tag names the release, so it must be the version the binary reports (`save-relay version`).
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="${cargo_version}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4 # the version is package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir panel build
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: panel/dist
          if-no-files-found: error

  build:
    # Linux is x86_64-unknown-linux-musl, a static binary with no glibc to match: GitHub's
    # oldest Ubuntu runner (22.04) is being retired, and a binary built against Ubuntu 24.04's
    # glibc may not start on an older SteamOS. The musl build needs musl-tools for ring's C.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          # Apple silicon only: the x86_64 Mac build is not worth a second macOS job for a
          # platform that is unsupported for 1.0.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: panel/dist
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          # The public app registrations that `src/clients.rs` reads (#36). The Google secrets are
          # public by design too, but they stay secrets so GitHub masks them in logs.
          SAVE_RELAY_GOOGLE_DESKTOP_ID: ${{ vars.SAVE_RELAY_GOOGLE_DESKTOP_ID }}
          SAVE_RELAY_GOOGLE_DESKTOP_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DESKTOP_SECRET }}
          SAVE_RELAY_GOOGLE_DEVICE_ID: ${{ vars.SAVE_RELAY_GOOGLE_DEVICE_ID }}
          SAVE_RELAY_GOOGLE_DEVICE_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DEVICE_SECRET }}
          SAVE_RELAY_DROPBOX_APP_KEY: ${{ vars.SAVE_RELAY_DROPBOX_APP_KEY }}
        run: |
          # A tag is a release, so it refuses to build without the registrations. A dry run builds
          # with empty ids: Nextcloud works, and Google Drive and Dropbox say they are not registered.
          # Each id is tested as it will be compiled: an empty id, or one with whitespace anywhere in
          # it, is refused. Nothing is trimmed, so a padded id never reaches cargo.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            for name in SAVE_RELAY_GOOGLE_DESKTOP_ID SAVE_RELAY_GOOGLE_DESKTOP_SECRET \
                        SAVE_RELAY_GOOGLE_DEVICE_ID SAVE_RELAY_GOOGLE_DEVICE_SECRET \
                        SAVE_RELAY_DROPBOX_APP_KEY; do
              value="${!name:-}"
              case "$value" in
                ""|*[[:space:]]*)
                  echo "::error::$name is empty or has whitespace: a release needs the app registrations (#36)"
                  exit 1
                  ;;
              esac
            done
          fi
          cargo build --locked --release --target "$TARGET" --features panel-dist
      - name: Smoke test (the runner runs this target)
        shell: bash
        run: |
          bin="target/$TARGET/release/save-relay$EXT"
          reported="$("$bin" version)"
          case "$reported" in
            "save-relay "[0-9]*) ;;
            *) echo "::error::unexpected version output: $reported"; exit 1 ;;
          esac
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            info="$(file -b "$bin")"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::the Linux binary is not static: $info"; exit 1 ;;
            esac
          fi
      - name: Name the binary
        id: name
        shell: bash
        run: |
          binary="save-relay-${VERSION}-${TARGET}${EXT}"
          mkdir -p dist
          cp "target/$TARGET/release/save-relay$EXT" "dist/$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.binary }}
          path: dist/${{ steps.name.outputs.binary }}
          if-no-files-found: error

  decky:
    # The Decky plugin zip (`decky/`) and the panel zip (`panel/dist`), both attached to the release
    # (ADR 0003, M15). The panel comes from the same `panel-dist` artifact the binaries embed. The
    # plugin carries the Linux binary as `bin/save-relay`, the first path `decky/main.py` runs: a
    # Game Mode plugin has no PATH install to fall back on.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version is package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir decky build
      - uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: panel/dist
      - uses: actions/download-artifact@v4
        with:
          name: save-relay-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-musl
          path: linux-binary
      - name: Zip the Decky plugin and the panel
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out="$PWD/dist"
          mkdir -p "$out" stage/save-relay/bin stage/save-relay/dist
          # Decky Loader installs a zip by its top-level folder, so the plugin sits under save-relay/.
          cp decky/plugin.json decky/main.py decky/package.json stage/save-relay/
          cp -r decky/dist/. stage/save-relay/dist/
          cp "linux-binary/save-relay-${VERSION}-x86_64-unknown-linux-musl" stage/save-relay/bin/save-relay
          # The artifact may lose the executable bit, and main.py checks it before it runs the binary.
          chmod +x stage/save-relay/bin/save-relay
          (cd stage && zip -r -X "$out/save-relay-decky-${VERSION}.zip" save-relay)
          (cd panel/dist && zip -X "$out/save-relay-panel-${VERSION}.zip" index.html app.js app.css)
          unzip -l "$out/save-relay-decky-${VERSION}.zip"
          unzip -l "$out/save-relay-panel-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: save-relay-decky-${{ needs.prepare.outputs.version }}
          path: dist/save-relay-decky-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: save-relay-panel-${{ needs.prepare.outputs.version }}
          path: dist/save-relay-panel-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error

  publish:
    # Runs on a dry run too: the SHA256SUMS file is part of what the dry run must produce. Only a
    # tag attaches the files to a release.
    needs: [prepare, build, decky]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: save-relay-*
          merge-multiple: true
          path: dist
      - name: SHA-256 sums
        working-directory: dist
        run: |
          sha256sum save-relay-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The glob also takes the Decky plugin zip and the panel zip (save-relay-decky-*, save-relay-panel-*).
          files: |
            dist/save-relay-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
