name: release

# Release binaries (#24, M8, M15). A `v*` tag builds the binaries, writes SHA256SUMS and attaches
# them, with the Decky plugin zip, the panel zip and the iOS library zip, to a GitHub release. A workflow_dispatch run
# does the same builds and uploads the files as run artifacts only: the dry run, and it makes no
# release. A pull request that changes this file gets the same dry run, so its head is built.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # The version, and the panel's front end: every binary embeds the same `panel/dist` with the
    # `panel-dist` feature (Cargo.toml), so it is built once here and passed on as an artifact.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A tag names the release, so it must be the version the binary reports (`save-relay version`).
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="${cargo_version}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # the version is package.json's packageManager
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir panel build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-dist
          path: panel/dist
          if-no-files-found: error

  build:
    # Linux is x86_64-unknown-linux-musl, a static binary with no glibc to match: GitHub's
    # oldest Ubuntu runner (22.04) is being retired, and a binary built against Ubuntu 24.04's
    # glibc may not start on an older SteamOS. The musl build needs musl-tools for ring's C.
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          # Apple silicon only: the x86_64 Mac build is not worth a second macOS job for a
          # platform that is unsupported for 1.0.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panel-dist
          path: panel/dist
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          # The app registrations `src/clients.rs` reads (#36). The ids and the Dropbox key are
          # optional overrides of the values pasted there (unset, they reach cargo empty and the
          # pasted values are built in). The Google secrets are public by design too, but they are
          # only here, as secrets, so GitHub masks them in logs.
          SAVE_RELAY_GOOGLE_DESKTOP_ID: ${{ vars.SAVE_RELAY_GOOGLE_DESKTOP_ID }}
          SAVE_RELAY_GOOGLE_DESKTOP_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DESKTOP_SECRET }}
          SAVE_RELAY_GOOGLE_DEVICE_ID: ${{ vars.SAVE_RELAY_GOOGLE_DEVICE_ID }}
          SAVE_RELAY_GOOGLE_DEVICE_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DEVICE_SECRET }}
          SAVE_RELAY_DROPBOX_APP_KEY: ${{ vars.SAVE_RELAY_DROPBOX_APP_KEY }}
        run: |
          # The ids and the Dropbox key are built in; the two Google secrets come only from this
          # repository's Actions secrets (GitHub's secret scanning refuses them in the code). A tag
          # is a release, so it refuses to build without them; a dry run without them builds with
          # Google Drive saying it is not registered. Every value that is set is tested as it will
          # be compiled, and one with whitespace anywhere in it is refused. Nothing is trimmed, so a
          # padded value never reaches cargo.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            for name in SAVE_RELAY_GOOGLE_DESKTOP_SECRET SAVE_RELAY_GOOGLE_DEVICE_SECRET; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not set: a release needs the Google app registration (#36)"
                exit 1
              fi
            done
          fi
          for name in SAVE_RELAY_GOOGLE_DESKTOP_ID SAVE_RELAY_GOOGLE_DESKTOP_SECRET \
                      SAVE_RELAY_GOOGLE_DEVICE_ID SAVE_RELAY_GOOGLE_DEVICE_SECRET \
                      SAVE_RELAY_DROPBOX_APP_KEY; do
            value="${!name:-}"
            case "$value" in
              *[[:space:]]*)
                echo "::error::$name has whitespace: an app registration override must be one token (#36)"
                exit 1
                ;;
            esac
          done
          cargo build --locked --release --target "$TARGET" --features panel-dist
      - name: Smoke test (the runner runs this target)
        shell: bash
        run: |
          bin="target/$TARGET/release/save-relay$EXT"
          reported="$("$bin" version)"
          case "$reported" in
            "save-relay "[0-9]*) ;;
            *) echo "::error::unexpected version output: $reported"; exit 1 ;;
          esac
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            info="$(file -b "$bin")"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::the Linux binary is not static: $info"; exit 1 ;;
            esac
          fi
      - name: Sign and notarize (macOS)
        # #239 (part of #238): signed with the hardened runtime and notarized when the signing
        # secrets are set; without them (a dry run, or until the Developer ID certificate is in
        # the repo) the binary stays unsigned and a tag warns. After the smoke test and the strip
        # (CARGO_PROFILE_RELEASE_STRIP above), because changing the file breaks the signature.
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/macos-sign.sh "target/$TARGET/release/save-relay"
      - name: Name the binary
        id: name
        shell: bash
        run: |
          binary="save-relay-${VERSION}-${TARGET}${EXT}"
          mkdir -p dist
          cp "target/$TARGET/release/save-relay$EXT" "dist/$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.binary }}
          path: dist/${{ steps.name.outputs.binary }}
          if-no-files-found: error

  decky:
    # The Decky plugin zip (`decky/`) and the panel zip (`panel/dist`), both attached to the release
    # (ADR 0003, M15). The panel comes from the same `panel-dist` artifact the binaries embed. The
    # plugin carries the Linux binary as `bin/save-relay`, the first path `decky/main.py` runs: a
    # Game Mode plugin has no PATH install to fall back on.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the version is package.json's packageManager
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir decky build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panel-dist
          path: panel/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: save-relay-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-musl
          path: linux-binary
      - name: Zip the Decky plugin and the panel
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out="$PWD/dist"
          mkdir -p "$out" stage/save-relay/bin stage/save-relay/dist
          # Decky Loader installs a zip by its top-level folder, so the plugin sits under save-relay/.
          cp decky/plugin.json decky/main.py decky/package.json stage/save-relay/
          cp -r decky/dist/. stage/save-relay/dist/
          cp "linux-binary/save-relay-${VERSION}-x86_64-unknown-linux-musl" stage/save-relay/bin/save-relay
          # The artifact may lose the executable bit, and main.py checks it before it runs the binary.
          chmod +x stage/save-relay/bin/save-relay
          (cd stage && zip -r -X "$out/save-relay-decky-${VERSION}.zip" save-relay)
          (cd panel/dist && zip -X "$out/save-relay-panel-${VERSION}.zip" index.html app.js app.css)
          unzip -l "$out/save-relay-decky-${VERSION}.zip"
          unzip -l "$out/save-relay-panel-${VERSION}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-relay-decky-${{ needs.prepare.outputs.version }}
          path: dist/save-relay-decky-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-relay-panel-${{ needs.prepare.outputs.version }}
          path: dist/save-relay-panel-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error

  ios:
    # The iOS library (#288, F92, M18): the C interface as a static library for aarch64-apple-ios,
    # with the header, the Swift wrapper and the module map in the repo's own layout (the module
    # map's `../../include/save_relay.h` resolves), so an iOS port pins a tag instead of building
    # from source. Needs no panel: the `ffi` build leaves out the embedded front end. The job checks
    # its own zip before it uploads it.
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - name: Build the library
        shell: bash
        env:
          SAVE_RELAY_GOOGLE_DESKTOP_ID: ${{ vars.SAVE_RELAY_GOOGLE_DESKTOP_ID }}
          SAVE_RELAY_GOOGLE_DESKTOP_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DESKTOP_SECRET }}
          SAVE_RELAY_GOOGLE_DEVICE_ID: ${{ vars.SAVE_RELAY_GOOGLE_DEVICE_ID }}
          SAVE_RELAY_GOOGLE_DEVICE_SECRET: ${{ secrets.SAVE_RELAY_GOOGLE_DEVICE_SECRET }}
          SAVE_RELAY_DROPBOX_APP_KEY: ${{ vars.SAVE_RELAY_DROPBOX_APP_KEY }}
        run: |
          # The FFI uses ClientSet::shipped(), so embed the same registrations as the binaries.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            for name in SAVE_RELAY_GOOGLE_DESKTOP_SECRET SAVE_RELAY_GOOGLE_DEVICE_SECRET; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not set: a release needs the Google app registration (#36)"
                exit 1
              fi
            done
          fi
          for name in SAVE_RELAY_GOOGLE_DESKTOP_ID SAVE_RELAY_GOOGLE_DESKTOP_SECRET \
                      SAVE_RELAY_GOOGLE_DEVICE_ID SAVE_RELAY_GOOGLE_DEVICE_SECRET \
                      SAVE_RELAY_DROPBOX_APP_KEY; do
            case "${!name:-}" in
              *[[:space:]]*)
                echo "::error::$name has whitespace: an app registration override must be one token (#36)"
                exit 1 ;;
            esac
          done
          cargo build --locked --release --lib --target aarch64-apple-ios --no-default-features --features ffi
      - name: Zip the library
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/dist"
          mkdir -p "$out" stage/lib stage/include stage/bindings/ios
          cp target/aarch64-apple-ios/release/libsave_relay.a stage/lib/
          cp include/save_relay.h stage/include/
          cp bindings/ios/SaveRelay.swift bindings/ios/module.modulemap stage/bindings/ios/
          cp LICENSE stage/
          (cd stage && zip -r -X "$out/save-relay-${VERSION}-aarch64-apple-ios.zip" lib include bindings LICENSE)
          unzip -l "$out/save-relay-${VERSION}-aarch64-apple-ios.zip"
      - name: Check the zip
        shell: bash
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          unzip -q "dist/save-relay-${VERSION}-aarch64-apple-ios.zip" -d "$check"
          for f in lib/libsave_relay.a include/save_relay.h bindings/ios/SaveRelay.swift bindings/ios/module.modulemap LICENSE; do
            test -f "$check/$f" || { echo "::error::the zip lacks $f"; exit 1; }
          done
          info="$(lipo -info "$check/lib/libsave_relay.a")"
          echo "$info"
          case "$info" in
            *"is architecture: arm64"*) ;;
            *) echo "::error::the library is not arm64: $info"; exit 1 ;;
          esac
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$check/obj"
          swiftc -target arm64-apple-ios15.0 -sdk "$sdk" -parse-as-library \
            -I "$check/bindings/ios" \
            -c "$check/bindings/ios/SaveRelay.swift" \
            -o "$check/obj/SaveRelay.o"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: save-relay-${{ needs.prepare.outputs.version }}-aarch64-apple-ios
          path: dist/save-relay-${{ needs.prepare.outputs.version }}-aarch64-apple-ios.zip
          if-no-files-found: error

  publish:
    # Runs on a dry run too: the SHA256SUMS file is part of what the dry run must produce. Only a
    # tag attaches the files to a release.
    needs: [prepare, build, decky, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: save-relay-*
          merge-multiple: true
          path: dist
      - name: SHA-256 sums
        working-directory: dist
        run: |
          sha256sum save-relay-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The glob also takes the Decky plugin zip, the panel zip and the iOS library zip (save-relay-decky-*, save-relay-panel-*, save-relay-*-aarch64-apple-ios.zip).
          files: |
            dist/save-relay-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
